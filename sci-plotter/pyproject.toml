[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sci-plotter"
version = "2.0.0"
description = "SCI-Plotter — 科研绘图桌面应用，基于 Web 技术栈的 Python 桌面 GUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "SCI-Plotter Team" },
]
keywords = ["scientific", "plotting", "chart", "visualization", "desktop", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pywebview>=4.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "pillow>=10.0",
    "chardet>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
sci-plotter = "sci_plotter.app:main"

[project.urls]
Homepage = "https://github.com/DavidNiteas/SCI-Plotter"
Documentation = "https://github.com/DavidNiteas/SCI-Plotter#readme"
Repository = "https://github.com/DavidNiteas/SCI-Plotter"
Issues = "https://github.com/DavidNiteas/SCI-Plotter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_plotter"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sci_plotter/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
