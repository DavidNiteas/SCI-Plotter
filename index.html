<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=sci-plotter-lite/">
    <title>SCI-Plotter — 科研绘图工具</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --text: #1f2937;
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .portal {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 32px; }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 20px;
        }
        .card-lite .card-icon { background: var(--primary-light); }
        .card-full .card-icon { background: #dcfce7; }
        .card h3 { font-size: 16px; margin-bottom: 6px; }
        .card p { font-size: 13px; color: #6b7280; line-height: 1.5; }
        .install {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .install h4 { font-size: 14px; margin-bottom: 10px; color: #6b7280; }
        code {
            display: block;
            background: #1f2937;
            color: #e5e7eb;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            text-align: left;
            margin-bottom: 8px;
        }
        .install-note { font-size: 12px; color: #9ca3af; }
        @media (max-width: 480px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="portal">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
            </svg>
        </div>
        <h1>SCI-Plotter</h1>
        <p class="subtitle">选择适合您的使用方式</p>

        <div class="cards">
            <a href="sci-plotter-lite/" class="card card-lite">
                <div class="card-icon">🌐</div>
                <h3>Lite 版本</h3>
                <p>零安装，浏览器直接打开<br>适合快速绘图与轻度使用</p>
            </a>
            <div class="card card-full">
                <div class="card-icon">🖥️</div>
                <h3>完整版</h3>
                <p>桌面级功能，本地文件系统<br>统计分析、矢量导出、自动保存</p>
            </div>
        </div>

        <div class="install">
            <h4>💡 安装桌面完整版</h4>
            <code>pip install sci-plotter</code>
            <code>sci-plotter</code>
            <p class="install-note">支持 Windows / macOS / Linux · 需要 Python 3.10+</p>
        </div>
    </div>
</body>
</html>
